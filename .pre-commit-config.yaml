repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-case-conflict
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
  - repo: local
    hooks:
      - id: skill-installation
        name: Verify the shared skill symlink installer
        entry: scripts/test-install.sh
        language: script
        pass_filenames: false
      - id: publication-safety
        name: Reject private paths and generated review artifacts
        entry: scripts/check-publication.sh
        language: script
        pass_filenames: false
