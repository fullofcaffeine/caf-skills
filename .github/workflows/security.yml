name: Security and skill validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the complete history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install pre-commit
        run: python -m pip install pre-commit==4.6.1
      - name: Run repository hooks
        run: SKIP=gitleaks pre-commit run --all-files
      - name: Scan Git history with Gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run publication safety sweep
        run: scripts/check-publication.sh --all
      - name: Test Oracle request lifecycle
        run: python skills/oracle-review/scripts/test_oracle_request.py
